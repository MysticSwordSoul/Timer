<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Aaj kitna padhe</title>
<meta name="theme-color" content="#0a0908">
<meta name="description" content="A simple offline study timer that tracks how long you study each subject.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padhe">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #0a0908;
    --ink: #f1ede4;
    --ink-dim: #a39e92;
    --ink-faint: #6b675e;
    --line: #2c2a26;
    --panel: #121110;
    --amber: #f5b82e;
    --amber-soft: rgba(245, 184, 46, .14);
    --serif: "Bodoni 72", "Bodoni MT", "Didot", "Playfair Display", "Hoefler Text", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--mono);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 0 calc(48px + env(safe-area-inset-bottom, 0px));
  }

  /* ambient glow: dim at rest, warm while studying */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 70% 55% at 22% 38%, rgba(245,184,46,.20), transparent 70%),
      radial-gradient(ellipse 50% 40% at 85% 10%, rgba(140,70,40,.10), transparent 70%);
    opacity: .45; transition: opacity 1.2s ease;
  }
  body.running::before { opacity: 1; }

  .dust { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .dust i {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: rgba(120, 50, 55, .55); filter: blur(1px);
    animation: drift 38s linear infinite;
  }
  .dust i:nth-child(1) { left: 24%; top: 2%;  animation-duration: 46s; }
  .dust i:nth-child(2) { left: 98%; top: 15%; width: 10px; height: 10px; animation-duration: 58s; animation-delay: -12s; }
  .dust i:nth-child(3) { left: 61%; top: 40%; width: 8px; height: 8px; animation-duration: 40s; animation-delay: -20s; }
  .dust i:nth-child(4) { left: 8%;  top: 75%; width: 11px; height: 11px; animation-duration: 64s; animation-delay: -5s; }
  .dust i:nth-child(5) { left: 80%; top: 88%; width: 9px; height: 9px; animation-duration: 52s; animation-delay: -30s; }
  @keyframes drift {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-30px, 40px); }
    100% { transform: translate(0, 0); }
  }

  main { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 clamp(18px, 5.9vw, 75px); }

  header { display: flex; justify-content: space-between; align-items: flex-start; min-height: 30px; }
  .heading { margin: 0; font: 500 13px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-dim); padding-top: 4px; }

  .icon-btn {
    background: none; border: 0; color: var(--ink-faint); cursor: pointer; padding: 8px; border-radius: 8px;
    display: inline-flex; transition: color .15s;
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn svg { width: 17px; height: 17px; display: block; }

  /* the clock */
  .clock {
    margin: clamp(0px, 1vw, 10px) 0 0 -.04em;
    font-family: var(--serif); font-weight: 800;
    font-size: clamp(60px, 16.8vw, 270px); line-height: 1; letter-spacing: -.015em;
    font-variant-numeric: lining-nums tabular-nums;
    color: var(--ink); white-space: nowrap; user-select: none;
    text-shadow: 0 0 60px rgba(245,184,46,.10);
  }
  .clock .sep { display: inline-block; transform: translateY(-.04em); }
  body.running .clock .sep { animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .45; } }

  .goal { height: 2px; background: var(--line); margin: 6px 0 0; border-radius: 2px; overflow: hidden; display: none; }
  .goal.on { display: block; }
  .goal b { display: block; height: 100%; width: 0; background: var(--amber); transition: width .6s ease; }
  .goal-note { display: none; margin: 8px 0 0; font-size: 12px; color: var(--ink-faint); }
  .goal-note.on { display: block; }

  .controls { display: flex; align-items: center; gap: 26px; margin-top: clamp(28px, 4vw, 52px); }
  .play {
    width: 106px; height: 106px; border-radius: 50%; border: 1px solid #3a3731; background: #1b1a18; color: var(--ink);
    display: grid; place-items: center; cursor: pointer; transition: border-color .2s, background .2s, transform .1s;
  }
  .play:hover { border-color: var(--amber); }
  .play:active { transform: scale(.97); }
  .play svg { width: 28px; height: 28px; }
  body.running .play { border-color: var(--amber); background: #231d0e; color: var(--amber); }
  .text-btn {
    background: none; border: 0; color: var(--ink-dim); font: inherit; font-size: 15px; letter-spacing: .06em;
    cursor: pointer; padding: 8px 4px;
  }
  .text-btn:hover { color: var(--ink); }

  .label { margin: clamp(36px, 5vw, 62px) 0 16px; font-size: 14px; letter-spacing: .12em; color: var(--ink-dim); }

  .subjects { display: flex; flex-wrap: wrap; gap: 14px; }
  .chip {
    position: relative; min-width: 173px; padding: 17px 20px 14px 23px; text-align: left;
    background: #131211; border: 1px solid #34312c; border-radius: 12px; color: var(--ink-dim);
    font: inherit; cursor: pointer; transition: border-color .2s, background .2s, color .2s;
  }
  .chip.custom { border-style: dashed; background: transparent; }
  .chip:hover { border-color: #55514a; }
  .chip .name { display: block; font-size: 17px; letter-spacing: .03em; padding-right: 30px; color: var(--ink-dim); overflow-wrap: anywhere; }
  .chip .time { display: block; margin-top: 8px; font-size: 14px; color: var(--ink); letter-spacing: .02em; }
  .chip .edit { position: absolute; top: 10px; right: 8px; padding: 6px; }
  .chip.active { border-color: var(--amber); border-style: solid; background: linear-gradient(180deg, rgba(245,184,46,.16), rgba(245,184,46,.07)); }
  .chip.active .name { color: var(--amber); font-weight: 600; }
  .chip.active .time { color: var(--ink); }
  body.running .chip.active { box-shadow: 0 0 28px rgba(245,184,46,.16); }

  .add {
    margin-top: 18px; display: flex; max-width: 620px; border: 1px solid #34312c; border-radius: 999px; background: rgba(18,17,16,.8); overflow: hidden;
  }
  .add:focus-within { border-color: var(--amber); }
  .add input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink); font: inherit; font-size: 15px; padding: 15px 22px; }
  .add input::placeholder { color: var(--ink-faint); }
  .add button { background: none; border: 0; color: var(--amber); font: inherit; font-size: 14px; padding: 0 24px; cursor: pointer; }
  .add button:hover { color: var(--ink); }

  .history { margin-top: clamp(40px, 6vw, 72px); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; max-width: 620px; align-items: end; height: 150px; }
  .day { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 8px; }
  .day .bar { width: 100%; max-width: 44px; min-height: 3px; background: #2b2924; border-radius: 4px 4px 0 0; transition: height .5s ease; }
  .day.today .bar { background: var(--amber); }
  .day .hrs { font-size: 12px; color: var(--ink-dim); }
  .day .dow { font-size: 12px; color: var(--ink-faint); }

  .hint { margin-top: 36px; font-size: 12px; color: var(--ink-faint); }

  /* dialogs */
  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid #3a3731; border-radius: 16px; padding: 26px;
    width: min(420px, calc(100vw - 32px)); font-family: var(--mono);
  }
  dialog::backdrop { background: rgba(0,0,0,.65); backdrop-filter: blur(3px); }
  dialog h2 { margin: 0 0 18px; font: 600 16px var(--mono); letter-spacing: .04em; }
  dialog p { margin: 0 0 18px; color: var(--ink-dim); line-height: 1.5; }
  dialog label { display: block; margin: 14px 0 6px; font-size: 12px; color: var(--ink-dim); letter-spacing: .06em; }
  dialog input {
    width: 100%; background: #0b0a09; border: 1px solid #34312c; border-radius: 9px; color: var(--ink);
    font: inherit; font-size: 15px; padding: 11px 13px; outline: 0;
  }
  dialog input:focus { border-color: var(--amber); }
  .hms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .hms span { display: block; font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }
  .actions .spacer { margin-right: auto; }
  .btn { font: inherit; font-size: 14px; padding: 10px 18px; border-radius: 9px; border: 1px solid #3a3731; background: transparent; color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: #666158; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #1a1405; font-weight: 600; }
  .btn.danger { color: #ff8a7a; border-color: #4a2a25; }
  .btn.danger.armed { background: #5a1f18; border-color: #8a3328; color: #ffd8d2; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
    background: #1d1b18; border: 1px solid #3a3731; padding: 12px 18px; border-radius: 10px; font-size: 13px; color: var(--ink);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 10; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  @media (max-width: 560px) {
    .play { width: 84px; height: 84px; }
    .controls { gap: 16px; }
    .chip { min-width: calc(50% - 7px); flex: 1 1 calc(50% - 7px); }
    .heading { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<main>
  <header>
    <h1 class="heading" id="heading">Aaj kitna padhe</h1>
    <button class="icon-btn" id="editPage" aria-label="Edit heading and daily goal">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
  </header>

  <div class="clock" id="clock" role="timer" aria-live="off">00:00:00</div>
  <div class="goal" id="goalBar"><b id="goalFill"></b></div>
  <p class="goal-note" id="goalNote"></p>

  <div class="controls">
    <button class="play" id="play" aria-label="Start timer"></button>
    <button class="text-btn" id="reset">reset today</button>
  </div>

  <div class="label">科目 — SUBJECT</div>
  <div class="subjects" id="subjects"></div>

  <form class="add" id="addForm" autocomplete="off">
    <input id="addInput" type="text" maxlength="30" placeholder="Add a subject" aria-label="New subject name">
    <button type="submit">Add</button>
  </form>

  <section class="history">
    <div class="label" style="margin-top:0">Last 7 days</div>
    <div class="days" id="days"></div>
  </section>

  <p class="hint">Space starts and pauses. Everything is saved on this device and works offline.</p>
</main>

<!-- subject dialog -->
<dialog id="subjDlg">
  <form method="dialog" id="subjForm">
    <h2>Edit subject</h2>
    <label for="sName">Name</label>
    <input id="sName" maxlength="30" required>
    <label>Today's time</label>
    <div class="hms">
      <div><span>hours</span><input id="sH" type="number" min="0" max="23" inputmode="numeric"></div>
      <div><span>minutes</span><input id="sM" type="number" min="0" max="59" inputmode="numeric"></div>
      <div><span>seconds</span><input id="sS" type="number" min="0" max="59" inputmode="numeric"></div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger spacer" id="sDel">Delete</button>
      <button type="button" class="btn" id="sCancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- page dialog -->
<dialog id="pageDlg">
  <form method="dialog" id="pageForm">
    <h2>Heading and goal</h2>
    <label for="pTitle">Heading</label>
    <input id="pTitle" maxlength="40" required>
    <label for="pGoal">Daily goal in hours (0 turns it off)</label>
    <input id="pGoal" type="number" min="0" max="24" step="0.5" inputmode="decimal">
    <div class="actions">
      <button type="button" class="btn" id="pCancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- reset dialog -->
<dialog id="resetDlg">
  <form method="dialog">
    <h2>Reset today?</h2>
    <p>All subject times for today go back to zero. Earlier days are not touched.</p>
    <div class="actions">
      <button type="button" class="btn" id="rCancel">Keep time</button>
      <button type="button" class="btn danger armed" id="rOk">Reset today</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const KEY = "aaj-kitna-padhe-v1";
  const $ = (id) => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const z = (n) => String(n).padStart(2, "0");
  const dayKey = (d = new Date()) => d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());

  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/></svg>';
  const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';

  const defaults = () => {
    const mk = (name, custom) => ({ id: uid(), name, custom: !!custom });
    const subjects = [mk("Physics"), mk("Chemistry"), mk("Mathematics"), mk("Biology"), mk("Test", true), mk("Misc", true)];
    return {
      title: "Aaj kitna padhe", goalHours: 0,
      subjects, selected: subjects[0].id,
      days: {},          // { "YYYY-MM-DD": { subjectId: milliseconds } }
      running: null,     // { id, since }
      lastSeen: 0
    };
  };

  let S;
  try {
    const raw = localStorage.getItem(KEY);
    S = raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults();
  } catch (e) { S = defaults(); }

  let storageOk = true;
  const save = () => {
    S.lastSeen = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
    catch (e) { storageOk = false; }
  };

  const addMs = (day, id, ms) => {
    if (ms <= 0) return;
    (S.days[day] = S.days[day] || {})[id] = (S.days[day][id] || 0) + ms;
  };

  // Move elapsed running time into storage, splitting across midnight if needed.
  const commit = (now) => {
    if (!S.running) return;
    let since = S.running.since;
    if (now <= since) { S.running.since = now; return; }
    while (since < now) {
      const d = new Date(since);
      const midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
      const stop = Math.min(now, midnight);
      addMs(dayKey(d), S.running.id, stop - since);
      since = stop;
    }
    S.running.since = now;
  };

  // Recover after reload: resume if the gap is short, otherwise pause at the last heartbeat.
  let toastOnLoad = "";
  if (S.running) {
    const now = Date.now();
    if (now - S.lastSeen < 60000) { commit(now); }
    else {
      const stopAt = Math.max(S.running.since, S.lastSeen);
      commit(stopAt);
      S.running = null;
      toastOnLoad = "Timer was paused while the page was closed.";
    }
  }
  if (!S.subjects.some((s) => s.id === S.selected)) S.selected = S.subjects[0] ? S.subjects[0].id : null;

  const subjMs = (id, day = dayKey()) => (S.days[day] && S.days[day][id]) || 0;
  const dayTotal = (day) => S.subjects.reduce((a, s) => a + subjMs(s.id, day), 0);

  const fmtClock = (ms) => {
    const t = Math.floor(ms / 1000);
    return z(Math.floor(t / 3600)) + '<span class="sep">:</span>' + z(Math.floor(t / 60) % 60) + '<span class="sep">:</span>' + z(t % 60);
  };
  const fmtClockText = (ms) => {
    const t = Math.floor(ms / 1000);
    return z(Math.floor(t / 3600)) + ":" + z(Math.floor(t / 60) % 60) + ":" + z(t % 60);
  };
  const fmtChip = (ms) => {
    const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    return (h ? h + "h " : "") + m + "m " + s + "s";
  };
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- render ----------
  const subjectsEl = $("subjects");
  const renderSubjects = () => {
    subjectsEl.innerHTML = "";
    S.subjects.forEach((s) => {
      const chip = document.createElement("div");
      chip.className = "chip" + (s.custom ? " custom" : "") + (s.id === S.selected ? " active" : "");
      chip.dataset.id = s.id;
      chip.tabIndex = 0;
      chip.setAttribute("role", "button");
      chip.setAttribute("aria-pressed", s.id === S.selected);
      chip.innerHTML = '<span class="name">' + esc(s.name) + '</span><span class="time">' + fmtChip(subjMs(s.id)) +
        '</span><button class="icon-btn edit" aria-label="Edit ' + esc(s.name) + '">' + ICON_EDIT + "</button>";
      subjectsEl.appendChild(chip);
    });
  };

  const renderDays = () => {
    const box = $("days"); box.innerHTML = "";
    const today = new Date(); const items = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      items.push({ d, ms: dayTotal(dayKey(d)), today: i === 0 });
    }
    const max = Math.max(3600000, ...items.map((x) => x.ms));
    items.forEach((x) => {
      const h = x.ms / 3600000;
      const el = document.createElement("div");
      el.className = "day" + (x.today ? " today" : "");
      el.innerHTML = '<span class="hrs">' + (h >= 10 ? h.toFixed(0) : h.toFixed(1)) + 'h</span><div class="bar" style="height:' +
        Math.max(3, (x.ms / max) * 90) + 'px"></div><span class="dow">' +
        x.d.toLocaleDateString(undefined, { weekday: "short" }) + "</span>";
      box.appendChild(el);
    });
  };

  const refreshLive = () => {
    const total = dayTotal(dayKey());
    $("clock").innerHTML = fmtClock(total);
    subjectsEl.querySelectorAll(".chip").forEach((c) => {
      c.querySelector(".time").textContent = fmtChip(subjMs(c.dataset.id));
    });
    if (S.goalHours > 0) {
      const goalMs = S.goalHours * 3600000;
      $("goalBar").classList.add("on"); $("goalNote").classList.add("on");
      $("goalFill").style.width = Math.min(100, (total / goalMs) * 100) + "%";
      const left = goalMs - total;
      $("goalNote").textContent = left > 0 ? fmtChip(left) + " to reach your " + S.goalHours + "h goal" : "Goal of " + S.goalHours + "h reached";
    } else { $("goalBar").classList.remove("on"); $("goalNote").classList.remove("on"); }
    const active = S.subjects.find((s) => s.id === S.selected);
    document.title = S.running ? fmtClockText(total) + " · " + (active ? active.name : "") : S.title;
  };

  const renderState = () => {
    document.body.classList.toggle("running", !!S.running);
    $("play").innerHTML = S.running ? ICON_PAUSE : ICON_PLAY;
    $("play").setAttribute("aria-label", S.running ? "Pause timer" : "Start timer");
    $("heading").textContent = S.title;
  };

  // ---------- actions ----------
  const toastEl = $("toast"); let toastT;
  const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 3200); };

  const start = () => {
    if (!S.selected) { toast("Add a subject first."); return; }
    S.running = { id: S.selected, since: Date.now() };
    renderState(); refreshLive(); save();
  };
  const pause = () => { commit(Date.now()); S.running = null; renderState(); refreshLive(); renderDays(); save(); };
  const toggle = () => (S.running ? pause() : start());

  const select = (id) => {
    if (id === S.selected) return;
    if (S.running) { commit(Date.now()); S.running = { id, since: Date.now() }; }
    S.selected = id;
    renderSubjects(); refreshLive(); save();
  };

  // ---------- events ----------
  $("play").addEventListener("click", toggle);

  subjectsEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    if (e.target.closest(".edit")) { openSubject(chip.dataset.id); return; }
    select(chip.dataset.id);
  });
  subjectsEl.addEventListener("keydown", (e) => {
    const chip = e.target.closest(".chip");
    if (chip && e.target === chip && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(chip.dataset.id); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && (e.target === document.body)) { e.preventDefault(); toggle(); }
  });

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("addInput").value.trim(); if (!name) return;
    if (S.subjects.some((s) => s.name.toLowerCase() === name.toLowerCase())) { toast(name + " already exists."); return; }
    const s = { id: uid(), name, custom: true };
    S.subjects.push(s); if (!S.selected) S.selected = s.id;
    $("addInput").value = ""; renderSubjects(); refreshLive(); save();
  });

  // subject dialog
  let editingId = null, delArmed = false;
  const sDlg = $("subjDlg");
  function openSubject(id) {
    const s = S.subjects.find((x) => x.id === id); if (!s) return;
    commit(Date.now());
    editingId = id; delArmed = false;
    $("sDel").textContent = "Delete"; $("sDel").classList.remove("armed");
    $("sName").value = s.name;
    const t = Math.floor(subjMs(id) / 1000);
    $("sH").value = Math.floor(t / 3600); $("sM").value = Math.floor(t / 60) % 60; $("sS").value = t % 60;
    sDlg.showModal();
  }
  $("sCancel").addEventListener("click", () => sDlg.close());
  $("sDel").addEventListener("click", () => {
    if (!delArmed) { delArmed = true; $("sDel").textContent = "Sure? Delete"; $("sDel").classList.add("armed"); return; }
    if (S.running && S.running.id === editingId) { commit(Date.now()); S.running = null; }
    S.subjects = S.subjects.filter((s) => s.id !== editingId);
    Object.values(S.days).forEach((d) => delete d[editingId]);
    if (S.selected === editingId) S.selected = S.subjects[0] ? S.subjects[0].id : null;
    sDlg.close(); renderState(); renderSubjects(); refreshLive(); renderDays(); save();
  });
  $("subjForm").addEventListener("submit", () => {
    const s = S.subjects.find((x) => x.id === editingId); if (!s) return;
    const name = $("sName").value.trim();
    if (name) s.name = name;
    const clamp = (v, max) => Math.min(max, Math.max(0, parseInt(v, 10) || 0));
    const ms = (clamp($("sH").value, 23) * 3600 + clamp($("sM").value, 59) * 60 + clamp($("sS").value, 59)) * 1000;
    commit(Date.now());
    (S.days[dayKey()] = S.days[dayKey()] || {})[s.id] = ms;
    renderSubjects(); refreshLive(); renderDays(); save();
  });

  // page dialog
  const pDlg = $("pageDlg");
  $("editPage").addEventListener("click", () => { $("pTitle").value = S.title; $("pGoal").value = S.goalHours; pDlg.showModal(); });
  $("pCancel").addEventListener("click", () => pDlg.close());
  $("pageForm").addEventListener("submit", () => {
    S.title = $("pTitle").value.trim() || "Aaj kitna padhe";
    S.goalHours = Math.min(24, Math.max(0, parseFloat($("pGoal").value) || 0));
    renderState(); refreshLive(); save();
  });

  // reset dialog
  const rDlg = $("resetDlg");
  $("reset").addEventListener("click", () => rDlg.showModal());
  $("rCancel").addEventListener("click", () => rDlg.close());
  $("rOk").addEventListener("click", () => {
    commit(Date.now());
    delete S.days[dayKey()];
    rDlg.close(); renderSubjects(); refreshLive(); renderDays(); save(); toast("Today was reset.");
  });

  // ---------- loop ----------
  let tick = 0, lastDay = dayKey();
  setInterval(() => {
    const now = Date.now();
    if (S.running) commit(now);
    if (dayKey() !== lastDay) { lastDay = dayKey(); renderDays(); }
    refreshLive();
    if (++tick % 5 === 0) save();
    if (tick % 30 === 0 && S.running) renderDays();
  }, 250);

  const flush = () => { if (S.running) commit(Date.now()); save(); };
  document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); else { if (S.running) commit(Date.now()); refreshLive(); } });
  window.addEventListener("pagehide", flush);
  window.addEventListener("beforeunload", flush);

  // ---------- offline / install ----------
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  // ---------- init ----------
  renderState(); renderSubjects(); renderDays(); refreshLive(); save();
  if (toastOnLoad) toast(toastOnLoad);
  if (!storageOk) toast("Saving is blocked in this browser, so progress won't be kept.");
})();
</script>
</body>
</html>
